<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Majlisga kirish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #1f9d55;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  .icon { font-size: 72px; line-height: 1; margin-bottom: 18px; }
  .icon.spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: .7; } }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 28px; color: var(--hint); font-size: 16px; line-height: 1.5; white-space: pre-line; max-width: 360px; }
  p.ok { color: var(--ok); font-size: 18px; }
  p.err { color: var(--err); }
  button {
    width: 100%; max-width: 360px; border: 0; border-radius: 12px; padding: 16px; margin-top: 10px;
    font-size: 17px; font-weight: 600; background: var(--btn); color: var(--btn-text);
  }
  button.ghost { background: transparent; color: var(--btn); font-weight: 500; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="icon spin" id="icon">📍</div>
  <h1 id="title">Joylashuv aniqlanmoqda…</h1>
  <p id="text">Bir soniya kuting.</p>
  <button id="primary" class="hidden"></button>
  <button id="secondary" class="ghost hidden"></button>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const primary = $("primary"), secondary = $("secondary");
  let busy = false;

  function screen(icon, title, text, cls, spin) {
    $("icon").textContent = icon;
    $("icon").className = spin ? "icon spin" : "icon";
    $("title").textContent = title;
    $("text").textContent = text || "";
    $("text").className = cls || "";
    primary.classList.add("hidden");
    secondary.classList.add("hidden");
  }
  function button(el, label, fn) { el.textContent = label; el.onclick = fn; el.classList.remove("hidden"); }
  function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

  if (!tg || !tg.initData) { screen("⚠️", "Botdan oching", "Bu sahifa faqat Telegram botdagi «Majlisga kirish» tugmasi orqali ishlaydi.", "err"); return; }
  tg.ready(); tg.expand();
  if (!["android", "ios"].includes(tg.platform)) { screen("📱", "Telefondan kiring", "Belgilanish faqat telefondagi Telegram ilovasi orqali ishlaydi.", "err"); return; }
  if (!tg.isVersionAtLeast("6.4")) { screen("⚠️", "Telegram eskirgan", "Iltimos, Telegram ilovasini yangilang.", "err"); return; }

  // ---------- Joylashuv ----------
  // Bir necha soniya davomida ikkala manbadan (brauzer GPS va Telegram) YANGI joylashuvlar yig'iladi
  // va eng aniqi tanlanadi. Bitta o'qishga ishonilmaydi: ba'zi telefonlar avval eski yoki taxminiy joyni beradi.
  const GOOD_ACC = 30;      // shundan aniq bo'lsa — darhol to'xtaymiz
  const MIN_WAIT = 2500;    // kamida shuncha kutamiz (birinchi o'qish ko'pincha eski bo'ladi)
  const MAX_WAIT = 12000;   // ko'pi bilan shuncha kutamiz

  function getBestLocation(onProgress) {
    return new Promise((resolve, reject) => {
      const t0 = Date.now();
      let best = null, finished = false, watchId = null, lmTimer = null;
      let browserDenied = false, lmDenied = false, lmDone = false, browserDone = !navigator.geolocation;
      const accOf = (f) => (f.accuracy == null || isNaN(f.accuracy)) ? Infinity : f.accuracy;

      function offer(fix) {
        if (finished || fix.lat == null || fix.lon == null) return;
        if (!best || accOf(fix) < accOf(best)) best = fix;
        onProgress && onProgress(best);
        if (accOf(best) <= GOOD_ACC && Date.now() - t0 >= MIN_WAIT) finish();
      }
      function finish() {
        if (finished) return;
        finished = true;
        if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} }
        clearTimeout(lmTimer); clearTimeout(hardStop); clearTimeout(minTimer);
        if (best) resolve(best);
        else reject((lmDenied || browserDenied) ? "denied" : "off");
      }
      function maybeFinishEarly() {   // ikkala manba ham ishlamasa — kutib o'tirmaymiz
        if (!best && lmDone && browserDone) finish();
      }

      // 1) Brauzer GPS: watchPosition — doimiy yangilanib turadi, eski (kesh) joylashuv olinmaydi
      if (navigator.geolocation) {
        try {
          watchId = navigator.geolocation.watchPosition(
            (p) => {
              if (p.timestamp && Date.now() - p.timestamp > 20000) return;  // 20 s dan eski — tashlaymiz
              offer({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy, source: "gps" });
            },
            (e) => { if (e.code === 1) browserDenied = true; browserDone = true; maybeFinishEarly(); },
            { enableHighAccuracy: true, timeout: MAX_WAIT, maximumAge: 0 }
          );
        } catch (e) { browserDone = true; }
      }

      // 2) Telegram LocationManager: bir necha marta so'raymiz
      const lm = tg.LocationManager;
      if (lm && tg.isVersionAtLeast("8.0")) {
        let tries = 0;
        const ask = () => {
          if (finished) return;
          lm.getLocation((d) => {
            tries++;
            if (d) offer({ lat: d.latitude, lon: d.longitude, accuracy: d.horizontal_accuracy, source: "tg" });
            else if (lm.isAccessRequested && !lm.isAccessGranted) { lmDenied = true; lmDone = true; maybeFinishEarly(); return; }
            if (tries < 4) lmTimer = setTimeout(ask, 1500); else { lmDone = true; maybeFinishEarly(); }
          });
        };
        lm.init(() => {
          if (!lm.isLocationAvailable) { lmDone = true; maybeFinishEarly(); return; }
          ask();
        });
      } else { lmDone = true; }

      const minTimer = setTimeout(() => { if (best && accOf(best) <= GOOD_ACC) finish(); }, MIN_WAIT);
      const hardStop = setTimeout(finish, MAX_WAIT);
      maybeFinishEarly();
    });
  }

  // ---------- QR: faqat Telegram'ning jonli kamera skaneri ----------
  function scanQr() {
    return new Promise((resolve, reject) => {
      let done = false;
      const onClose = () => { tg.offEvent("scanQrPopupClosed", onClose); if (!done) reject("closed"); };
      tg.onEvent("scanQrPopupClosed", onClose);
      try {
        tg.showScanQrPopup({ text: "Majlis xonasidagi QR kodni skanerlang" }, (text) => {
          if (done) return true;
          done = true;
          tg.offEvent("scanQrPopupClosed", onClose);
          resolve(text);
          return true;
        });
      } catch (e) { tg.offEvent("scanQrPopupClosed", onClose); reject("failed"); }
    });
  }

  async function run() {
    if (busy) return;
    busy = true;
    try {
      // 1. Joylashuv
      screen("📍", "Joylashuv aniqlanmoqda…", "Bir necha soniya kuting.", "", true);
      let loc;
      try {
        loc = await getBestLocation((f) => {
          const acc = (f.accuracy == null || isNaN(f.accuracy)) ? "" : `Aniqlik: ±${Math.round(f.accuracy)} m`;
          $("text").textContent = acc ? acc + "\nAniqroq bo'lishini kutyapmiz…" : "Bir necha soniya kuting.";
        });
      }
      catch (e) {
        haptic("error");
        if (e === "denied") {
          screen("📍", "Joylashuvga ruxsat bering", "Majlisga belgilanish uchun joylashuvga ruxsat kerak.", "err");
          if (tg.LocationManager && tg.isVersionAtLeast("8.0")) button(primary, "Ruxsat berish", () => tg.LocationManager.openSettings());
          button(secondary, "Qayta urinish", run);
        } else {
          screen("📍", "Joylashuvni yoqing", "Telefoningizda joylashuv (GPS) o'chiq.\nUni yoqib, «Qayta urinish»ni bosing.", "err");
          button(primary, "Qayta urinish", run);
        }
        return;
      }

      // 2. Kamera
      screen("📷", "QR kodni skanerlang", "Kamerani majlis xonasidagi QR kodga qarating.", "", false);
      let qr;
      try { qr = await scanQr(); }
      catch (e) {
        screen("📷", "Skanerlash bekor qilindi", "", "");
        button(primary, "Kamerani ochish", run);
        return;
      }

      // 3. Tekshirish
      screen("⏳", "Tekshirilmoqda…", "", "", true);
      let data;
      try {
        const res = await fetch("/api/checkin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData, qr: qr, lat: loc.lat, lon: loc.lon, accuracy: loc.accuracy,
                                 source: loc.source })
        });
        data = await res.json();
      } catch (e) {
        screen("📶", "Internet bilan muammo", "Serverga ulanib bo'lmadi.", "err");
        button(primary, "Qayta urinish", run);
        return;
      }
      if (data.ok) {
        haptic("success");
        screen("✅", "Davomatga qo'shildingiz", data.message, "ok");
        button(primary, "Yopish", () => tg.close());
      } else {
        haptic("error");
        screen("❌", "Qabul qilinmadi", data.message || "Xatolik yuz berdi.", "err");
        button(primary, "Qayta urinish", run);
        button(secondary, "Yopish", () => tg.close());
      }
    } finally {
      busy = false;
    }
  }

  run();  // ilova ochilishi bilan avtomatik boshlanadi
})();
</script>
</body>
</html>
